# Build and publish PolarChat desktop apps (Tauri v2, system webview).
# Each platform builds natively — argon2 and better-sqlite3 are native Node
# modules and must be compiled on the target OS/arch, never cross-bundled.
# Triggered by version tags (v*.*.*).

name: Release Desktop App

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, ubuntu-22.04, windows-latest]
        # macos-latest = Apple Silicon, macos-13 = Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - run: npm ci

      # tauri-action runs beforeBuildCommand (scripts/prepare-desktop.mjs),
      # which builds client+server, stages resources, and fetches the Node
      # sidecar runtime — then builds the bundle and uploads it to the release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PolarChat ${{ github.ref_name }} (Beta)'
          releaseBody: |
            ## PolarChat ${{ github.ref_name }}
            Privacy-first. End-to-end encrypted. Open source.
          releaseDraft: false
          prerelease: true
